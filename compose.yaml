services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crud_app
      POSTGRES_USER: crud_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crud_app -d crud_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: