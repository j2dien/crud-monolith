services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crud_app
      POSTGRES_USER: crud_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crud_app -d crud_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    profiles: ["test"]
    image: postgres:17
    environment:
      POSTGRES_DB: crud_app_test
      POSTGRES_USER: crud_test
      POSTGRES_PASSWORD: test_only_password
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U crud_test -d crud_app_test
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build:
      context: .
      args:
        BUN_VERSION: "${BUN_VERSION:-1}"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://crud_app:local_dev_password@postgres:5432/crud_app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/api/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data: