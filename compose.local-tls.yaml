services:
  proxy:
    image: caddy:2
    restart: unless-stopped

    ports:
      - "127.0.0.1:8443:443"

    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config

    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_local_data:
  caddy_local_config: