name: crud-monolith-production

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: "postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}"
  APP_ORIGINS: "${APP_ORIGINS:?required}"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?required}"
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: "crud-monolith:${APP_TAG:-local}"
    restart: "no"

    environment: *app-environment

    command: ["bun", "src/db/migrate.ts"]

    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: "crud-monolith:${APP_TAG:-local}"

    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_VERSION: "${BUN_VERSION:?required}"

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    environment: *app-environment

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'try { const r = await fetch("http://127.0.0.1:3000/api/ready", { signal: AbortSignal.timeout(4000) }); process.exit(r.ok ? 0 : 1); } catch { process.exit(1); }'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data: